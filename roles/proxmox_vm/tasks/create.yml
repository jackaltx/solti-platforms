---
# Create VM from Debian 12 template
# This task clones a VM from template, resizes disk, and configures cloud-init

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vm_vmid is defined
      - vm_name is defined
      - vm_template_vmid is defined
    fail_msg: "vm_vmid, vm_name, and vm_template_vmid are required for create action"

- name: Check if template {{ vm_template_vmid }} exists
  ansible.builtin.command:
    cmd: "qm status {{ vm_template_vmid }}"
  register: template_status
  changed_when: false
  failed_when: false

- name: Fail if template does not exist
  ansible.builtin.fail:
    msg: "Template VMID {{ vm_template_vmid }} not found. Please create template first."
  when: template_status.rc != 0

- name: Check if target VMID {{ vm_vmid }} already exists
  ansible.builtin.command:
    cmd: "qm status {{ vm_vmid }}"
  register: vmid_check
  changed_when: false
  failed_when: false

- name: Fail if VMID already in use
  ansible.builtin.fail:
    msg: "VMID {{ vm_vmid }} already exists. Choose a different VMID or remove the existing VM."
  when: vmid_check.rc == 0

# This is where the cloing work is done

- name: Clone template {{ vm_template_vmid }} to VM {{ vm_vmid }} (linked clone)
  ansible.builtin.command:
    cmd: "qm clone {{ vm_template_vmid }} {{ vm_vmid }} --name {{ vm_name }} --full {{ '1' if not vm_linked_clone else '0' }}"
  register: clone_result
  changed_when: clone_result.rc == 0

- name: Get VM configuration to find boot disk
  ansible.builtin.command:
    cmd: "qm config {{ vm_vmid }}"
  register: vm_config_raw
  changed_when: false

- name: Extract boot disk name from configuration
  ansible.builtin.set_fact:
    boot_disk: "{{ vm_config_raw.stdout_lines | select('match', '^boot:.*') | first | regex_search('order=([^,;]+)', '\\1') | first }}"

# CLAUDE:  you cannot shrink, only grow!

# - name: Resize boot disk to {{ vm_disk_size }}
#   ansible.builtin.command:
#     cmd: "qm disk resize {{ vm_vmid }} {{ boot_disk }} {{ vm_disk_size }}"
#   register: resize_result
#   changed_when: resize_result.rc == 0

# CLAUDE: Guest agent pre-installed in template via virt-customize
# No cicustom needed - agent baked into base image

- name: Copy SSH public key to Proxmox host
  ansible.builtin.copy:
    src: "{{ vm_ssh_key_file }}"
    dest: "/tmp/vm-{{ vm_vmid }}-sshkey.pub"
    mode: "0644"

- name: Configure cloud-init user, SSH key, and password
  ansible.builtin.command:
    cmd: >-
      qm set {{ vm_vmid }}
      --ciuser {{ vm_ansible_user }}
      --sshkeys /tmp/vm-{{ vm_vmid }}-sshkey.pub
      {{ '--cipassword ' + vm_ansible_password if vm_ansible_password else '' }}
  register: cloudinit_result
  changed_when: cloudinit_result.rc == 0
  no_log: true

- name: Set network bridge to {{ vm_bridge }}
  ansible.builtin.command:
    cmd: "qm set {{ vm_vmid }} --net0 virtio,bridge={{ vm_bridge }},mtu=1"
  register: net_result
  changed_when: net_result.rc == 0

- name: Remove temporary SSH key file
  ansible.builtin.file:
    path: "/tmp/vm-{{ vm_vmid }}-sshkey.pub"
    state: absent

- name: Get final VM configuration
  ansible.builtin.command:
    cmd: "qm config {{ vm_vmid }}"
  register: vm_config_final
  changed_when: false

- name: vm_config_final?
  ansible.builtin.debug:
    var: vm_config_final

# CLAUDE: this feeds back my input...may not be real
#  Think: 'as designed' vs 'as built'

- name: Display VM creation summary
  ansible.builtin.debug:
    msg:
      - "✓ VM created successfully"
      - "  Template VMID: {{ vm_template_vmid }}"
      - "  New VM: {{ vm_name }} (VMID {{ vm_vmid }})"
      - "  Disk: {{ boot_disk }} ({{ vm_disk_size }})"
      - "  Clone type: {{ 'Full' if not vm_linked_clone else 'Linked' }}"
      - "  Cloud-init user: {{ vm_ansible_user }} (password: {{ 'set' if vm_ansible_password else 'not set' }})"
      - "  Bridge: {{ vm_bridge }}"
      - "  Network: {{ vm_ip_config }}"
      - ""
      - "To start the VM: qm start {{ vm_vmid }}"
