---
name: Lint and Syntax Check

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install yamllint
      run: pip install yamllint

    - name: Run yamllint
      run: yamllint .

  markdown-lint:
    name: Markdown Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli

    - name: Run markdownlint
      run: markdownlint "**/*.md" --ignore node_modules

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install ansible-lint
      run: pip install ansible-lint ansible-core

    - name: Run ansible-lint
      run: ansible-lint

  syntax-check:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Ansible
      run: pip install ansible-core

    - name: Syntax check all playbooks
      run: |
        # Only check actual playbooks in playbooks/ directory
        # Exclude role files (defaults/, tasks/, handlers/, vars/, meta/)
        if [ -d "playbooks" ]; then
          for playbook in playbooks/*.yml playbooks/*.yaml; do
            [ -f "$playbook" ] || continue
            echo "Checking $playbook"
            ansible-playbook --syntax-check "$playbook" || exit 1
          done
        else
          echo "No playbooks directory found, skipping syntax check"
        fi

  notify-matrix:
    name: Notify Matrix
    runs-on: ubuntu-latest
    needs: [yaml-lint, markdown-lint, ansible-lint, syntax-check]
    if: always()
    steps:
      - name: Send CI result to Matrix
        env:
          MATRIX_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
          MATRIX_TOKEN: ${{ secrets.MATRIX_CI_TOKEN }}
          MATRIX_ROOM: ${{ secrets.MATRIX_CI_ROOM_ID }}
        run: |
          STATUS="${{ needs.yaml-lint.result }}/${{ needs.markdown-lint.result }}/${{ needs.ansible-lint.result }}/${{ needs.syntax-check.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            ICON="❌"
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            ICON="⚠️"
          else
            ICON="✅"
          fi
          ROOM_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${MATRIX_ROOM}'))")
          TXN_ID="ci-$(date +%s%N)"
          curl -sf -X PUT "${MATRIX_URL}/_matrix/client/v3/rooms/${ROOM_ENCODED}/send/m.room.message/${TXN_ID}" \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"m.text\",\"body\":\"${ICON} ${{ github.repository }} lint — ${STATUS} (${{ github.ref_name }} @ ${GITHUB_SHA::7})\"}"
